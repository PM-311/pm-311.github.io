<footer>
  <div class='row'>
    <div class='col-lg-12'>
      <p>{{ site.sitename }}</p>
      <p><small>Última modificación:
        {% assign gmt5_time = site.time | date: "%s" | minus: 18000 %}
        <time datetime='{{ gmt5_time | date: "%Y-%m-%dT%H:%M:%S-05:00" }}'>{{ gmt5_time | date: "%d/%m/%Y %H:%M" }} GMT-5</time>
      </small></p>
    </div>
  </div>
</footer>
